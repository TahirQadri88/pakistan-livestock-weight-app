<!doctype html>
<meta charset="utf-8">
<title>Pakistan Livestock Weight tests</title>
<style>body{font:16px system-ui;margin:2rem;max-width:54rem}li.pass{color:#176b3a}li.fail{color:#a22}iframe{width:100%;height:760px;border:1px solid #ccc;margin-top:1rem}</style>
<h1>Browser test harness</h1><p id="summary"></p><ul id="results"></ul><iframe id="app" src="../index.html"></iframe>
<script type="module">
import { ANIMALS, estimateWeight, validateMeasurements } from '../js/estimator.js';
import { clearHistory, readHistory, saveHistory } from '../js/storage.js';
import { translations } from '../js/i18n.js';
const results=[]; const check=(name,pass)=>results.push({name,pass});
const memory=()=>{const data=new Map;return{getItem:k=>data.get(k)||null,setItem:(k,v)=>data.set(k,v),removeItem:k=>data.delete(k)}};
check('all four animal types are supported', ANIMALS.length===4 && ANIMALS.every(a=>estimateWeight(a,72,68)>0));
check('valid decimal measurements pass validation', !Object.keys(validateMeasurements({girth:'72.5',length:'68.2'})).length);
for(const value of ['', 'no', '-2', '0', '121']) check(`invalid girth (${JSON.stringify(value)}) is rejected`, Boolean(validateMeasurements({girth:value,length:'68'}).girth));
for(const value of ['', 'no', '-2', '0', '101']) check(`invalid length (${JSON.stringify(value)}) is rejected`, Boolean(validateMeasurements({girth:'72',length:value}).length));
const store=memory();
check('history starts empty', readHistory(store).length===0);
saveHistory({animal:'cattle',girth:72,length:68,weight:200,date:'2026-01-01T00:00:00.000Z'},store);
check('history saves and reads safely', readHistory(store).length===1);
clearHistory(store); check('history clears', readHistory(store).length===0);
store.setItem('plw-history-v2','not-json'); check('corrupt history is ignored', readHistory(store).length===0);
check('English and Urdu contain core UI strings', ['en','ur'].every(lang=>translations[lang].calculate&&translations[lang].formulaNote&&translations[lang].animalType));
const frame=document.querySelector('#app');
await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
const doc=frame.contentDocument;
doc.querySelector('#girth').value='72'; doc.querySelector('#length').value='68'; doc.querySelector('#calculatorForm').requestSubmit();
check('valid form renders a result', !doc.querySelector('#resultSection').hidden && doc.querySelector('#weightValue').textContent!=='—');
doc.querySelector('#languageToggle').click();
check('language toggle activates Urdu RTL', doc.documentElement.lang==='ur'&&doc.documentElement.dir==='rtl'&&doc.querySelector('#languageToggle').textContent==='English');
document.querySelector('#summary').textContent=`${results.filter(r=>r.pass).length}/${results.length} tests passed`;
document.querySelector('#results').replaceChildren(...results.map(r=>{const li=document.createElement('li');li.className=r.pass?'pass':'fail';li.textContent=`${r.pass?'PASS':'FAIL'} — ${r.name}`;return li}));
</script>
