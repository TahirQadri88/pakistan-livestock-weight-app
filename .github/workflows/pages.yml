name: Deploy to GitHub Pages

on:
  push:
    branches: [main, app-redesign-v1, app-redesign-v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepare production build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = ['./css/production-ui.css', './css/qa-share-fix.css']
          js = ['./js/production-ui.js', './js/qa-share-fix.js']
          for path in css:
              tag = f'<link rel="stylesheet" href="{path}">'
              if tag not in s:
                  s = s.replace('</head>', f'  {tag}\n</head>')
          for path in js:
              tag = f'<script src="{path}"></script>'
              if tag not in s:
                  s = s.replace('</body>', f'  {tag}\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
