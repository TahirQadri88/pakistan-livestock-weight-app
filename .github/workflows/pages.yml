name: Deploy to GitHub Pages
on:
  push:
    branches: [main, app-redesign-v1, app-redesign-v2]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Wire final QA layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'css/final-fixes.css' not in s:
              s = s.replace('</head>', '  <link rel="stylesheet" href="./css/final-fixes.css">\n</head>')
          if 'js/final-fixes.js' not in s:
              s = s.replace('</body>', '  <script src="./js/final-fixes.js"></script>\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
